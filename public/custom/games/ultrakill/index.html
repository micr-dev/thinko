<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | ULTRAKILL WEB PORT</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #231f20;
      }
    </style>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width=1280 height=720 style="width: 1280px; height: 720px; background: #231F20"></canvas>
    <script src="Build/ultrakill.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function notifyParent(payload) {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(
              Object.assign({ type: "XP_GAME_LOADING", gameId: "ultrakill" }, payload),
              window.location.origin
            );
          }
        } catch (error) {}
      }

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      } else {
        var resizeCanvas = function () {
          canvas.style.width = window.innerWidth + "px";
          canvas.style.height = window.innerHeight + "px";
        };

        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);
      }

      notifyParent({ progress: 10, label: "Preparing Unity player..." });

      createUnityInstance(canvas, {
        dataUrl: "Build/ultrakill.data.unityweb",
        frameworkUrl: "Build/ultrakill.framework.js.unityweb",
        codeUrl: "Build/ultrakill.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Hakita and Cake Logic",
        productName: "ULTRAKILL WEB PORT",
        productVersion: "1.4",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }, function (progress) {
        var percent = Math.max(14, Math.min(96, Math.round(progress * 100)));
        notifyParent({
          progress: percent,
          label: percent < 90 ? "Loading ULTRAKILL assets..." : "Starting ULTRAKILL..."
        });
      }).then(function (unityInstance) {
        window.unityInstance = unityInstance;
        notifyParent({ progress: 100, label: "ULTRAKILL ready", ready: true });
      }).catch(function (error) {
        console.error(error);
        notifyParent({ progress: 100, label: "Failed to load ULTRAKILL", error: true });
      });
    </script>
  </body>
</html>
